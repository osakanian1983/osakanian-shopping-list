<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<title>購入リスト - Osakanian</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>購入リスト</h1>
  </header>

  <form id="add-form" class="add-form">
    <input id="item-input" type="text" placeholder="買うものを入力" autocomplete="off" required>
    <button type="submit">追加</button>
  </form>

  <section class="list-section">
    <ul id="pending-list" class="item-list"></ul>

    <div id="bought-block" class="bought-block" hidden>
      <button id="toggle-bought" type="button" class="bought-toggle">
        購入済み (<span id="bought-count">0</span>) <span id="bought-arrow">▾</span>
      </button>
      <ul id="bought-list" class="item-list bought-list"></ul>
    </div>
  </section>

  <p id="empty-message" class="empty-message" hidden>リストは空です。買うものを追加しましょう。</p>
</div>

<script src="app.js"></script>
</body>
</html>
