<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<title>楽天ROOM投稿ジェネレーター - Osakanian</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rakuten-room-generator.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>楽天ROOM投稿ジェネレーター</h1>
    <p class="rr-sub">悩み解決・商品紹介型の投稿を3パターン自動生成。ジャンルはボタンを押すたびに自動で切り替わります。</p>
    <a class="rr-back" href="index.html">← 購入リストに戻る</a>
  </header>

  <section class="rr-controls">
    <button id="generate-btn" type="button" class="rr-generate-btn">今日の投稿を生成する</button>
    <p id="genre-label" class="rr-genre-label"></p>
    <p id="product-info" class="rr-product-info"></p>
    <p class="rr-product-note">※価格・在庫は変動するため、投稿前に楽天市場で最新情報をご確認ください。</p>
  </section>

  <section class="rr-result">
    <div class="rr-result-actions">
      <button id="copy-btn" type="button" class="rr-copy-btn">全文コピー</button>
      <span id="copy-status" class="rr-copy-status"></span>
    </div>
    <pre id="output" class="rr-output"></pre>
    <p id="char-counts" class="rr-char-counts"></p>
  </section>
</div>

<script src="rakuten-room-generator.js"></script>
</body>
</html>
