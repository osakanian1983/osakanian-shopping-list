<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<title>投稿ジェネレーター - Osakanian</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="post-generator.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>投稿ジェネレーター</h1>
    <p class="pg-sub">ボタンでAmazon（Threads向け）と楽天ROOM向けを切り替えて、悩み解決・商品紹介型の投稿を3パターン自動生成します。</p>
    <a class="pg-back" href="index.html">← 購入リストに戻る</a>
  </header>

  <div class="pg-platform-toggle" role="tablist" aria-label="投稿先を切り替え">
    <button type="button" class="pg-platform-btn active" data-platform="amazon" role="tab" aria-selected="true">Amazon / Threads</button>
    <button type="button" class="pg-platform-btn" data-platform="rakuten" role="tab" aria-selected="false">楽天ROOM</button>
  </div>

  <section class="pg-controls">
    <button id="generate-btn" type="button" class="pg-generate-btn">今日の投稿を生成する</button>
    <p id="genre-label" class="pg-genre-label"></p>
    <p id="product-info" class="pg-product-info"></p>
    <p id="product-note" class="pg-product-note"></p>
  </section>

  <section class="pg-result">
    <div class="pg-result-actions">
      <button id="copy-btn" type="button" class="pg-copy-btn">全文コピー</button>
      <span id="copy-status" class="pg-copy-status"></span>
    </div>
    <pre id="output" class="pg-output"></pre>
    <p id="char-counts" class="pg-char-counts"></p>
  </section>
</div>

<script src="post-generator.js"></script>
</body>
</html>
