<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<title>楽天トラベル投稿ジェネレーター - Osakanian</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rakuten-travel-generator.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>楽天トラベル投稿ジェネレーター</h1>
    <p class="rt-sub">悩み解決・宿泊施設紹介型の投稿を3パターン自動生成。テーマはボタンを押すたびに自動で切り替わります。</p>
    <a class="rt-back" href="index.html">← 購入リストに戻る</a>
  </header>

  <section class="rt-controls">
    <button id="generate-btn" type="button" class="rt-generate-btn">今日の投稿を生成する</button>
    <p id="genre-label" class="rt-genre-label"></p>
    <p id="product-info" class="rt-product-info"></p>
    <p class="rt-product-note">※料金・空室状況は変動するため、投稿前に楽天トラベルで最新情報をご確認ください。</p>
  </section>

  <section class="rt-result">
    <div class="rt-result-actions">
      <button id="copy-btn" type="button" class="rt-copy-btn">全文コピー</button>
      <span id="copy-status" class="rt-copy-status"></span>
    </div>
    <pre id="output" class="rt-output"></pre>
    <p id="char-counts" class="rt-char-counts"></p>
  </section>
</div>

<script src="rakuten-travel-generator.js"></script>
</body>
</html>
